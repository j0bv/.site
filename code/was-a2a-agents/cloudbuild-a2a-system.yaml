# Cloud Build configuration for WAS A2A System
steps:
  # Build the A2A system
  - name: 'golang:1.21'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd pkg
        go mod tidy
        go mod download
        go build -o a2a-system ../cmd/a2a-system/main.go

  # Build Docker image for A2A system
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/axial-studio-470521-b9/was-a2a-system:latest'
      - '-f'
      - 'Dockerfile.a2a'
      - '.'

  # Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/axial-studio-470521-b9/was-a2a-system:latest'

  # Deploy A2A system to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'was-a2a-system'
      - '--image'
      - 'gcr.io/axial-studio-470521-b9/was-a2a-system:latest'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--port'
      - '8080'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=axial-studio-470521-b9'
      - '--allow-unauthenticated'

  # Deploy MCP Server
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'was-mcp-server'
      - '--image'
      - 'gcr.io/axial-studio-470521-b9/was-a2a-system:latest'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--port'
      - '8081'
      - '--max-instances'
      - '3'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=axial-studio-470521-b9,MCP_SERVER_MODE=true'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
